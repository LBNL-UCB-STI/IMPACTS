fleet:
  region: sfbay
  year: 2018
  scenario: Baseline
  seed: 0
  output: examples/emfac/fleet/output

  # Single standardized Bayesian/DAG model input.
  # It contains the DAG structure, weights, category families, constraints,
  # and all embedded evidence tables.
  vehicle_type_assignment_model_settings: examples/emfac/fleet/vehicle_type_assignment_model.yaml

  mapping:
    emfac_atlas_map: examples/emfac/fleet/mappings/atlas_emfac_xwalk.csv
    emfac_beam_class_map: examples/emfac/fleet/mappings/emfac_beam_class_mapping.csv
    emfac_beam_fuel_map: examples/emfac/fleet/mappings/emfac_beam_fuel_mappings.csv
    emfac_fuel_alternatives_map: examples/emfac/fleet/mappings/emfac_fuel_alternatives.csv
    beam_class_alternatives_map: examples/emfac/fleet/mappings/beam_class_alternatives.csv
    atlas_bodytype_alternatives_map: examples/emfac/fleet/mappings/atlas_bodytype_alternatives.csv
    fastsim_atlas_bodytype_xwalk_file: examples/emfac/fleet/mappings/fastsim_atlas_bodytype_xwalk.csv
    fastsim_atlas_fuel_mapping_file: examples/emfac/fleet/mappings/fastsim_atlas_fuel_mapping.csv
    frism_atlas_map: examples/emfac/fleet/mappings/atlas_frism_xwalk.csv
    fastsim_frism_bodytype_xwalk_file: examples/emfac/fleet/mappings/fastsim_frism_bodytype_xwalk.csv
    fastsim_frism_fuel_mapping_file: examples/emfac/fleet/mappings/fastsim_frism_fuel_mapping.csv

  emfac:
    outputs: examples/emfac/fleet/output/emfac
    region_label: SF
    calendar_year: 2018
    model_year_groups:
      light_duty:
        - max_year: 2003
        - min_year: 2004
          max_year: 2014
        - min_year: 2015
      medium_heavy_duty:
        - max_year: 2002
        - min_year: 2003
          max_year: 2006
        - min_year: 2007
          max_year: 2009
        - min_year: 2010
          max_year: 2012
        - min_year: 2013
          max_year: 2015
        - min_year: 2016
    inputs:
      project_analysis:
        - main:
            - folder: ~/Workspace/Models/emfac/raw/sfbay-emfac-project-analysis
            - pto_as_process:
                enabled: true
                vehicle_category:
                  - T7 Public Class 8
                  - T7 Utility Class 8
                  - T7 Single Concrete/Transit Mix Class 8
                  - T7 Single Dump Class 8
                  - T7 Single Other Class 8
                  - T7 SWCV Class 8
        - black_carbon:
            - folder: ~/Workspace/Models/emfac/raw/sfbay-emfac-moves-bc
            - pollutant: BCh
        - paved_road_dust:
            - folder: ~/Workspace/Models/emfac/raw/statewide-carb-road-dust
      emissions_inventory:
        - main: ~/Workspace/Models/emfac/raw/sfbay-emfac-emissions-inventory
        - fallback: ~/Workspace/Models/emfac/raw/statewide-emfac-emissions-inventory

  atlas:
    year: 2019
    vehicles_file: ~/Workspace/Simulation/sfbay/atlas/atlas-2019/vehicles_2019.parquet
    households_file: ~/Workspace/Simulation/sfbay/atlas/atlas-2019/households.parquet
    persons_file: ~/Workspace/Simulation/sfbay/atlas/atlas-2019/persons.parquet
    income_bins: [0, 30, 60, 100, 200, 9999]

  frism:
    year: 2018
    carriers_file: ~/Workspace/Simulation/sfbay/beam-ft/20250730/2018-Baseline/carriers--2018-Baseline.parquet
    payloads_file: ~/Workspace/Simulation/sfbay/beam-ft/20250730/2018-Baseline/payloads--2018-Baseline.parquet
    tours_file: ~/Workspace/Simulation/sfbay/beam-ft/20250730/2018-Baseline/tours--2018-Baseline.parquet

  fastsim:
    passenger_vehicle_types_file: ~/Workspace/Simulation/sfbay/vehicle-tech/vehicleTypes_inventory.csv
    freight_vehicle_types_file: ~/Workspace/Simulation/sfbay/beam-ft/20250730/vehicle-tech/vehicletypes--frism--2018-Baseline.csv
    ldv_fastsim_data_folder: ~/Workspace/Models/beam-data/beam-data-sfbay/vehicle-tech/fuel/Baseline_FASTSimData_Representative_Vehicles_lookup_tables_output
    mhdv_fastsim_data_folder: ~/Workspace/Models/beam-data/beam-data-sfbay/vehicle-tech/fuel/Freight_Baseline_FASTSimData_2020
