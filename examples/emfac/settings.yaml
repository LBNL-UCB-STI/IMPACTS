emfac:
  region:
    name: sfbay
    label: SF
  scenario:
    year: 2018
    name: Baseline
  seed: 0
  output: examples/emfac/output

  activities:
    model_year_groups:
      light_duty:
        - "<=2003"
        - "2004-2014"
        - ">=2015"
      medium_heavy_duty:
        - "<=2002"
        - "2003-2006"
        - "2007-2009"
        - "2010-2012"
        - "2013-2015"
        - ">=2016"
    project_analysis:
      - main:
          - folder: ~/Workspace/Models/emfac/raw/sfbay-emfac-project-analysis
          - pto_as_process:
              enabled: true
              vehicle_category:
                - T7 Public Class 8
                - T7 Utility Class 8
                - T7 Single Concrete/Transit Mix Class 8
                - T7 Single Dump Class 8
                - T7 Single Other Class 8
                - T7 SWCV Class 8
      - black_carbon:
          - folder: ~/Workspace/Models/emfac/raw/sfbay-emfac-moves-bc
          - pollutant: BCh
      - paved_road_dust:
          - folder: ~/Workspace/Models/emfac/raw/statewide-carb-road-dust
          - road_category_map:
              motorway: Freeway
              motorway_link: Freeway
              trunk: Freeway
              trunk_link: Major
              primary: Major
              primary_link: Major
              secondary: Collector
              secondary_link: Collector
              tertiary: Collector
              tertiary_link: Collector
              unclassified: Collector
              residential: Local Urban
    emissions_inventory:
      - inventory_folder: ~/Workspace/Models/emfac/raw/sfbay-emfac-emissions-inventory
      - fallback_folder: ~/Workspace/Models/emfac/raw/statewide-emfac-emissions-inventory
      - vehicle_category_attributes_file: ~/Workspace/Models/beam-data/beam-data-sfbay/vehicle-tech/_emissions_vehicle_catalog.csv
      - fuel_map:
          Dsl: [Diesel]
          Elec: [Electricity]
          Gas: [Gasoline]
          NG: [Natural Gas]
          Phe: [Plug-in Hybrid]

  fleet:
    # Single standardized vehicle-type assignment model file.
    # It contains the named freight and passenger assignment models,
    # including scoring weights and embedded evidence tables.
    vehicle_type_assignment_model_settings: examples/emfac/fleet_assignment.yaml

    atlas:
      year: 2019
      vehicles_file: ~/Workspace/Simulation/sfbay/urbansim/vehicles.csv.gz
      households_file: ~/Workspace/Simulation/sfbay/urbansim/households.parquet
      persons_file: ~/Workspace/Simulation/sfbay/urbansim/persons.parquet
      income_bins: [0, 30, 60, 100, 200, 9999]
      fuel_map:
        gasoline: [conv, hybrid, cng]
        electricity: [ev]
        hydrogen: [fuelcell]
        electricity+gasoline: [phev]

    frism:
      year: 2018
      carriers_file: ~/Workspace/Simulation/sfbay/beam-ft/20250730/2018-Baseline/carriers--2018-Baseline.parquet
      payloads_file: ~/Workspace/Simulation/sfbay/beam-ft/20250730/2018-Baseline/payloads--2018-Baseline.parquet
      tours_file: ~/Workspace/Simulation/sfbay/beam-ft/20250730/2018-Baseline/tours--2018-Baseline.parquet

    beam:
      passenger_vehicle_types_file: ~/Workspace/Simulation/sfbay/vehicle-tech/vehicleTypes_inventory.csv
      freight_vehicle_types_file: ~/Workspace/Simulation/sfbay/beam-ft/20250730/vehicle-tech/vehicletypes--frism--2018-Baseline.csv
      fuel_consumption_catalog: ~/Workspace/Models/beam-data/beam-data-sfbay/vehicle-tech/_fuel_vehicle_catalog.csv
