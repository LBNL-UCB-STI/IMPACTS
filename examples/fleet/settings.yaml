fleet:
  region: sfbay
  scenario: 2018-Baseline
  seed: 0
  output: examples/fleet/output

  mapping:
    emfac_atlas_map: examples/fleet/mappings/atlas_emfac_xwalk.csv
    emfac_beam_class_map: examples/fleet/mappings/emfac_beam_class_mapping.csv
    emfac_beam_fuel_map: examples/fleet/mappings/emfac_beam_fuel_mappings.csv
    emfac_beam_fuel_alternatives_map: examples/fleet/mappings/emfac_beam_fuel_alternatives.csv
    naics_emfac_sector_map: examples/fleet/mappings/naics_emfac_sector_mapping.csv
    naics_emfac_priority_map: examples/fleet/mappings/naics_emfac_priority_mapping.csv
    payloadtype_emfac_map: examples/fleet/mappings/payloadtype_emfac_category_mapping.csv
    beam_freight_class_alternatives_map: examples/fleet/mappings/freight_class_alternatives.csv
    beam_passenger_bodytype_alternatives_map: examples/fleet/mappings/passenger_bodytype_alternatives.csv
    fastsim_bodytype_xwalk_file: examples/fleet/mappings/fastsim_vehicle_bodytype_xwalk.csv
    fastsim_atlas_fuel_mapping_file: examples/fleet/mappings/fastsim_atlas_fuel_mapping.csv

  emfac:
    rates_file: ~/Workspace/Models/emfac/processed/2018/sf-emfac-2018-project-analysis-final-rates.parquet
    activity_file: ~/Workspace/Models/emfac/processed/2018/sf-emfac-2018-project-analysis-final-activity.parquet
    fleet_file: ~/Workspace/Models/emfac/processed/2018/sf-emfac-2018-project-analysis-final-fleet.parquet

  atlas:
    year: 2019
    vehicles_file: ~/Workspace/Simulation/sfbay/atlas/atlas-2019/vehicles_2019.parquet
    households_file: ~/Workspace/Simulation/sfbay/atlas/atlas-2019/households.parquet
    persons_file: ~/Workspace/Simulation/sfbay/atlas/atlas-2019/persons.parquet
    income_bins: [0, 30, 60, 100, 200, 9999]

  frism:
    year: 2018
    carriers_file: ~/Workspace/Simulation/sfbay/beam-ft/20250730/2018-Baseline/carriers--2018-Baseline.parquet
    payloads_file: ~/Workspace/Simulation/sfbay/beam-ft/20250730/2018-Baseline/payloads--2018-Baseline.parquet
    tours_file: ~/Workspace/Simulation/sfbay/beam-ft/20250730/2018-Baseline/tours--2018-Baseline.parquet

  fastsim:
    passenger:
      vehicle_types_file: ~/Workspace/Simulation/sfbay/vehicle-tech/vehicleTypes_inventory.csv
      fastsim_data_folder: ~/Workspace/Models/beam-data/beam-data-sfbay/vehicle-tech/fuel/Baseline_FASTSimData_Representative_Vehicles_lookup_tables_output
    freight:
      vehicle_types_file: ~/Workspace/Simulation/sfbay/beam-ft/20250730/vehicle-tech/vehicletypes--frism--2018-Baseline.csv
      fastsim_data_folder: ~/Workspace/Models/beam-data/beam-data-sfbay/vehicle-tech/fuel/Freight_Baseline_FASTSimData_2020
