main:
  mapping_section: osm_grid
  rates_section: emissions_rates
  emissions_mapping_section: emissions_grid_mapping
  dispersion_section: dispersion_isrm
  population_section: activitysim_population

emissions_events:
  events_input_path: null
  link_length_path: upstream/network.csv.gz
  iteration: 1
  use_rates: true

emissions_rates:
  rates_dir: upstream/rates

osm_grid:
  osm_pbf_path: upstream/sfbay-cbg5500-weakConn-network.osm.pbf
  beam_network_path: upstream/network.csv.gz
  inmap_grid_path: upstream/isrm_polygon/isrm_polygon.shp
  beam_osm_id_col: attributeOrigId
  beam_length_col: linkLength
  beam_osm_epsg: 4326
  aermod_grid_epsg: 4326
  inmap_grid_epsg: 4326
  output_epsg: 4326
  aermod_grid_path: null
  beam_network_columns:
    osm_id: attributeOrigId
    length: linkLength
  grid_columns:
    cell_id: isrm

emissions_grid_mapping:
  skims_input_path: upstream/0.skimsEmissionsTotals_5pct_sample.csv.gz
  mapping_input_path: null
  prepared_skims_group_cols:
    - linkId
    - vehicleTypeId
    - process
  prepared_pollutants:
    - NH3
    - NOx
    - PM2_5
    - SOx
    - ROG
    - BCh
  county_correction_factors_path: null
  county_correction_columns:
    county_fips: COUNTYFP
    vmt_factor: corr_VMT_by_county
    trips_factor: corr_trips_by_county
  # Matches the legacy BEAM_EMFAC freight notebook annualization factor
  # for representative operating days per year.
  annualization_days: 330.0
  skims_columns:
    hour: hour
    link_id: linkId
    vehicle_type: vehicleTypeId
    process: process
    emissions: emissions
    observations: observations
    iterations: iterations
    travel_time: travelTimeInSecond
    parking_duration: parkingDurationInSecond
  mapping_columns:
    link_id: edge_linkId
    proportion: zone_edge_proportion
    grid_id: zone_isrm

dispersion_isrm:
  isrm_url: s3://example/isrm.zarr
  concentration_factor: 1.0
  include_health: true
  emissions_columns:
    grid_id: GRID
    rog: tons_per_year_ROG
    nox: tons_per_year_NOx
    nh3: tons_per_year_NH3
    sox: tons_per_year_SOx
    pm25: tons_per_year_PM2_5

activitysim_population:
  persons_path: null
  households_path: null
  persons_columns:
    household_id: household_id
    cell_id: cell_id
    age: age
    sex: sex
  households_columns:
    household_id: household_id
    cell_id: cell_id
    income: income
