impacts:
  local_input_folder: ${beam.local_input_folder}
  local_output_folder: impacts/output/
  emissions:
    simulation_network_folder: {local_input_folder}
    osm_network_folder: ${local_input_folder}/r5/sfbay-cbg5500-weakConn-network
    emissions_rates_folder: {local_input_folder}/vehicle-tech/emissions/2018-Baseline
    activity_totals_file: {local_input_folder}/vehicle-tech/emissions/SFBay_2018_Annual_activity_totals.parquet
    annualization_days: 330
    population_sample: 0.1
    pollutants_map:
      NH3: NH3
      NOx: NOx
      PM2_5: PM2_5
      SOx: SOx
      ROG: ROG
      BC: BCh
  dispersions:
    inmap:
      isrm_zarr: s3://inmap-model/isrm_v1.2.1.zarr/
      isrm_nox_to_no2_matrix_npz: {local_input_folder}/vehicle-tech/dispersions/inmap/nox_to_no2_full_isrm_matrix.npz
      grid_path: {local_input_folder}/vehicle-tech/dispersions/inmap/isrm_polygon/isrm_polygon.shp
      grid_id: isrm
      grid_epsg:
    aermod:
      grid_path:
      grid_epsg:
      grid_id:
