emfac:
  region_label: SF
  calendar_year: 2018
  outputs: ~/Workspace/Models/emfac/processed/{calendar_year}/
  # Separate model year groups are used for light-duty and medium/heavy-duty vehicles.
  # This keeps emission profiles, deterioration rates, and zero-mile rates aligned with
  # their distinct regulatory and technology milestones in EMFAC2021.
  model_year_groups:
    # Light-duty vehicles (passenger cars and light-duty trucks).
    # These bins align with older pre-LEV2 vehicles, the LEV2/OBD2 era, and the
    # transition to stricter LEV3 standards.
    light_duty:
      - max_year: 2003  # Older technology and pre-LEV2 vehicles
      - min_year: 2004
        max_year: 2014  # Introduction and duration of LEV2 and OBD2 standards
      - min_year: 2015  # Transition to stricter LEV3 (e.g., ULEV 70, SULEV 30) standards

    # Medium and heavy-duty vehicles (Class 4 through Class 8).
    # These bins align with major USEPA engine emission standards, including the
    # 2003-2006 2.0g NOx era, plus the Heavy-Duty OBD phase-in timeline.
    medium_heavy_duty:
      - max_year: 2002  # Captures older pre-2.0g NOx standards
      - min_year: 2003
        max_year: 2006  # 2.0g NOx standards era
      - min_year: 2007
        max_year: 2009  # Transition to 2007 EPA standards and introduction of OEM DPFs
      - min_year: 2010
        max_year: 2012  # Transition to stricter 2010 EPA standards
      - min_year: 2013
        max_year: 2015  # Heavy-Duty OBD phase-in period
      - min_year: 2016  # Full implementation of Heavy-Duty OBD requirements

  inputs:
    project_analysis:
      - main:
          - folder: ~/Workspace/Models/emfac/raw/sfbay-emfac-project-analysis
          - pto_as_process:
              enabled: true
              vehicle_category:
                - T7 Public Class 8
                - T7 Utility Class 8
                - T7 Single Concrete/Transit Mix Class 8
                - T7 Single Dump Class 8
                - T7 Single Other Class 8
                - T7 SWCV Class 8
      - black_carbon:
          - folder: ~/Workspace/Models/emfac/raw/sfbay-emfac-moves-bc
          - pollutant: BCh
      - paved_road_dust:
          - folder: ~/Workspace/Models/emfac/raw/road_dust/statewide-carb-road-dust
    emissions_inventory:
      - main: ~/Workspace/Models/emfac/raw/sfbay-emfac-emissions-inventory
      - fallback: ~/Workspace/Models/emfac/raw/statewide-emfac-emissions-inventory
