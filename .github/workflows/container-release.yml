name: Container release

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]

jobs:
  build-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE: ghcr.io/lbnl-ucb-sti/impacts
      VERSION: ${{ github.event.release.tag_name || 'ci' }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate release tag
        if: github.event_name == 'release'
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH: $VERSION" >&2
            exit 1
          fi

      - name: Build container
        run: docker build --build-arg IMAGE_VERSION="$VERSION" --tag "$IMAGE:$VERSION" .

      - name: Smoke-test command interfaces
        run: |
          set -euo pipefail
          docker run --rm --workdir / "$IMAGE:$VERSION" derive_settings_from_pilates --help
          docker run --rm --workdir / "$IMAGE:$VERSION" presim --help
          docker run --rm --workdir / "$IMAGE:$VERSION" postsim --help
          workspace="$RUNNER_TEMP/impacts-smoke"
          mkdir -p "$workspace"
          chmod 777 "$workspace"
          docker run --rm \
            --workdir / \
            --mount "type=bind,src=$PWD/tests/fixtures/pilates-bridge.yaml,dst=/tmp/bridge.yaml,readonly" \
            --mount "type=bind,src=$workspace,dst=/app/workspace" \
            "$IMAGE:$VERSION" derive_settings_from_pilates \
            --pilates-settings /tmp/bridge.yaml --output /app/workspace/settings.yaml
          test -s "$workspace/settings.yaml"
          docker run --rm \
            --workdir / \
            --mount "type=bind,src=$workspace,dst=/app/workspace" \
            "$IMAGE:$VERSION" presim --config /app/workspace/settings.yaml
          docker run --rm \
            --workdir / \
            --mount "type=bind,src=$PWD/tests/test_container_cli_smoke.py,dst=/tmp/test_container_cli_smoke.py,readonly" \
            --mount "type=bind,src=$PWD/tests/fixtures,dst=/tmp/fixtures,readonly" \
            "$IMAGE:$VERSION" python /tmp/test_container_cli_smoke.py

  publish:
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: build-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/lbnl-ucb-sti/impacts
      VERSION: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate release tag
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH: $VERSION" >&2
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish versioned image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: IMAGE_VERSION=${{ env.VERSION }}
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}

      - name: Verify anonymous pull for HPC
        run: |
          anonymous_config="$RUNNER_TEMP/anonymous-docker-config"
          mkdir -p "$anonymous_config"
          DOCKER_CONFIG="$anonymous_config" docker pull "$IMAGE:$VERSION"
